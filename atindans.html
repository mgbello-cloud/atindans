<html>
<head>
    <title>Attendance List</title>
</head>
<body align="center" bgcolor="#ADDBFF">

    <input type="text" id="studentName" placeholder="Enter student name">
    <button id="attendance">Present</button>

    <fieldset>
	<legend> Attendance List: </legend>
    <!-- This stores my attendancelist -->
    <div id="attendanceList"></div>

    <script>
        let maxStudents = 27;
        let attendance = [];

        let btn = document.getElementById("attendance");

        btn.addEventListener("click", function() {
            let Sname = document.getElementById("studentName").value;

            // It is the responsible for checking if the user input something
            if (Sname === "") {
                alert("Please enter a name!");
                return;
            }

            // This is the one who checks the limit of the attendance length
            if (attendance.length < maxStudents) {
                // This adds the 'Sname' into attendance using push
                attendance.push(Sname);

                // This clears the user input area
                document.getElementById("studentName").value = "";

                // This gives the 'Sname' numbers infront of them
                let Hcount = "";
                for (let i = 0; i < attendance.length; i++) {
                    Hcount = Hcount + (i + 1) + ". " + attendance[i] + "<br>";
                }
				
				// This is the use of div, everytime the user input something it will be stored inside the attendanceList
                document.getElementById("attendanceList").innerHTML = Hcount;
            } else {
				
				// And this is the use of decision making else it decides if the attendanceList reach the maxStudents
                alert("Limit reached!");
            }
        });
    </script>

</fieldset>

</body>
</html>
